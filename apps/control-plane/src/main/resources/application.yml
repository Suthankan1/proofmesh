spring:
  application:
    name: proofmesh-control-plane

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: proofmesh
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    default-schema: proofmesh
    schemas: proofmesh

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/proofmesh}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/proofmesh/protocol/openid-connect/certs}
          audiences:
            - ${OIDC_AUDIENCE:proofmesh-control-plane}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

proofmesh:
  execution-grant:
    issuer: ${PROOFMESH_EXECUTION_GRANT_ISSUER:proofmesh-control-plane}
    audience: ${PROOFMESH_EXECUTION_GRANT_AUDIENCE:proofmesh-gateway}
    grant-ttl: ${PROOFMESH_EXECUTION_GRANT_TTL:30s}