services:
  postgres:
    image: postgres:18.6-alpine
    container_name: proofmesh-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proofmesh}
      POSTGRES_USER: ${POSTGRES_USER:-proofmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofmesh_dev_only}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    volumes:
      - proofmesh_postgres_data:/var/lib/postgresql

volumes:
  proofmesh_postgres_data: