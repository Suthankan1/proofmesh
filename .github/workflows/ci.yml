name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    name: Control Plane
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/control-plane

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/control-plane/pom.xml

      - name: Verify
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify